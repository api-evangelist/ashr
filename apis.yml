aid: ashr
name: Ashr
description: >-
  Ashr (Ashr Labs) is a testing and evaluation platform for AI agents. It lets
  teams test agents in real environments, generate realistic user-journey
  datasets, run graded evaluations across text, voice, image, and file
  modalities, catch regressions, and monitor agents in production. Ashr
  integrates as a Python or TypeScript SDK (pip install ashr-labs) into an
  existing codebase, exposing an AshrLabsClient plus EvalRunner and RunBuilder
  to fetch a dataset, run it against your agent, submit results for server-side
  grading, poll graded metrics, and trace production runs. The hosted Ashr Labs
  console at lab.ashr.io provides datasets, test timelines, prompt versioning,
  and analytics. Founded by Shreyas Kaps and Rohan Kulkarni; Y Combinator
  Winter 2026; based in San Francisco.
